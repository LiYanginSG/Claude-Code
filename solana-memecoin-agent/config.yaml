# =============================================================================
# Crypto agent configuration
#
# The numbers in `risk:` are not suggestions. They are enforced in code by
# agent/risk.py, which sits between the LLM and the broker. The LLM cannot
# see, change, or argue its way past them.
# =============================================================================

account:
  base_currency: SGD
  starting_equity: 100.00      # the S$100

market:
  # Which pairs the agent may touch. Anything not on this list is rejected
  # by the risk engine even if the model insists.
  allowlist:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h
  lookback_candles: 200        # how much history the brain sees

  # Data source: live | replay | synthetic
  #   live      - public REST endpoint, no API key needed (read-only)
  #   replay    - a CSV you supply in data/  (best for honest backtests)
  #   synthetic - deterministic generated series, for smoke-testing the rig
  source: synthetic
  replay_file: data/btc_1h.csv
  live_endpoint: binance       # binance | kraken | coinbase

costs:
  # Be pessimistic here. Optimistic fee assumptions are how backtests lie.
  # SG retail reality: Coinhako ~0.6%, Independent Reserve ~0.5%,
  # Crypto.com ~0.25-0.5% depending on tier. Default to the painful end.
  taker_fee_pct: 0.60          # per side, percent
  slippage_pct: 0.10           # per side, percent
  spread_pct: 0.05             # quoted-vs-mid, percent

risk:
  # --- position sizing ---
  max_position_pct: 25.0       # max % of equity in any single asset
  max_total_exposure_pct: 50.0 # max % of equity deployed across all assets
  min_trade_sgd: 20.00         # below this, fees eat the edge. Don't bother.

  # --- fee budget: the rail that actually matters at S$100 ---
  max_trades_per_day: 2
  daily_fee_budget_pct: 0.50   # halt for the day once fees hit 0.5% of equity

  # --- loss control ---
  stop_loss_pct: 8.0           # per-position hard stop
  take_profit_pct: 15.0        # per-position target
  max_drawdown_pct: 20.0       # KILL SWITCH: liquidate everything and halt
  cooldown_minutes: 240        # no re-entry for 4h after a stop-out

  # --- absolute ceiling ---
  max_notional_sgd: 100.00     # never deploy more than this, ever

brain:
  # Which engine makes the call.
  #   claude      - LLM decides, risk engine vetoes
  #   deterministic - trend/mean-reversion rules, no LLM, no API key needed
  engine: claude
  model: claude-opus-5
  temperature: 0.2             # low: we want consistency, not creativity
  max_tokens: 1200
  fallback_to_deterministic: true   # if the API fails, don't just stall

live:
  # Flipping this to true is necessary but NOT sufficient. See .env.example.
  enabled: false
  exchange: ""                 # e.g. "independentreserve"

run:
  interval_minutes: 60
  max_iterations: 0            # 0 = run forever; >0 = stop after N (backtests)
  log_dir: runs
